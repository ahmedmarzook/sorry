<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بتحبيني؟</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #fad0c4);
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-size: clamp(1.6em, 6vw, 2.5em);
  }
  h1 {
    font-size: 2.5em;
    color: #4a2c2a;
    margin-bottom: 40px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
  }
  .buttons {
    position: relative;
    width: 300px;
    height: 80px;
  }
  button {
    padding: 15px 35px;
    font-size: 1.2em;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s ease;
  }
  #yesBtn {
    background: #4caf50;
    color: white;
    position: absolute;
    right: 10px;
    top: 0;
  }
  #yesBtn:hover {
    transform: scale(1.1);
  }
  #noBtn {
    background: #f44336;
    color: white;
    position: absolute;
    left: 10px;
    top: 0;
    transition: left 0.15s ease, top 0.15s ease, transform 0.15s ease;
  }
  #message {
    margin-top: 30px;
    font-size: 1.5em;
    color: #4a2c2a;
    min-height: 40px;
  }
  .heart {
    position: fixed;
    font-size: 24px;
    animation: floatUp 3s ease-in forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-300px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>❤️ بتحبيني؟ ❤️</h1>
  <div class="buttons">
    <button id="yesBtn" onclick="sayYes()">اه 😍</button>
    <button id="noBtn" onmouseover="runAway()" ontouchstart="runAway(event)" onclick="runAway()">لا 😅</button>
  </div>
  <div id="message"></div>
  <audio id="loveSong" src="EGA072500211.m4a" preload="auto"></audio>
<script>
  const noBtn = document.getElementById('noBtn');
  const messages = [
    "برضو مش هسيبك تدوسي! 😂",
    "لا لا لا، مفيش لا هنا! 🙅‍♀️",
    "حاولي تاني... مش هينفع! 😜",
    "بجد بتحاولي ليه؟ 😏",
    "الزرار مش عايز يتلمس خالص! 🏃‍♀️"
  ];
  let msgIndex = 0;
  function runAway(e) {
    if (e && e.cancelable) e.preventDefault();
    const btnW = noBtn.offsetWidth || 120;
    const btnH = noBtn.offsetHeight || 60;
    const maxX = Math.max(window.innerWidth - btnW - 10, 10);
    const maxY = Math.max(window.innerHeight - btnH - 10, 10);
    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;
    noBtn.style.position = 'fixed';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
    document.getElementById('message').innerText = messages[msgIndex % messages.length];
    msgIndex++;
  }
  function sayYes() {
    document.getElementById('message').innerText = "🥰 كنت متأكد إنك هتقولي اه بحبكككك يامزززتيييي";
    const song = document.getElementById('loveSong');
    song.currentTime = 0;
    song.play().catch(() => {});
    for (let i = 0; i < 20; i++) {
      createHeart();
    }
  }
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '❤️';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = window.innerHeight + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }
</script>
</body>
</html>
